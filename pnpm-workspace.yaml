strictPeerDependencies: true
autoInstallPeers: false

auditLevel: moderate

minimumReleaseAge: 1440

# Audit a package's build script before listing it here.
allowBuilds:
  # Selects the platform-specific native binary; required by WXT/Vite build.
  esbuild: true
  spawn-sync: false

# Floors that clear Dependabot alerts on transitive deps.
overrides:
  tmp: ">=0.2.7"
  uuid: ">=11.1.1"
  # Capped below 8: jsdom imports undici/lib/handler/wrap-handler.js, which 8 removed.
  undici: ">=7.29.1 <8.0.0"
  vite: ">=8.0.16"
  shell-quote: ">=1.9.0"
  esbuild: ">=0.28.1"
  postcss: ">=8.5.23"
  # Scoped to 1.x consumers and capped there: an override replaces their range, so an
  # open floor resolves to the latest major.
  brace-expansion@1: "^1.1.21"
  adm-zip: ">=0.6.1"
