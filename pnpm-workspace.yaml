strictPeerDependencies: true
autoInstallPeers: false

auditLevel: moderate

minimumReleaseAge: 1440

# Audit a package's build script before listing it here.
allowBuilds:
  # Selects the platform-specific native binary; required by WXT/Vite build.
  esbuild: true
  spawn-sync: false

# Floors that clear Dependabot alerts on transitive deps.
overrides:
  tmp: ">=0.2.7"
  uuid: ">=11.1.1"
  # Capped below 8: jsdom imports undici/lib/handler/wrap-handler.js, which 8 removed.
  undici: ">=7.29.0 <8.0.0"
  vite: ">=8.0.16"
  shell-quote: ">=1.9.0"
  esbuild: ">=0.28.1"
  postcss: ">=8.5.23"
  # Scoped to the 1.x line: 2.x consumers are unaffected and can't satisfy a 1.1.16 floor.
  brace-expansion@1: ">=1.1.16"
  adm-zip: ">=0.6.1"
