name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".editorconfig"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".editorconfig"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (default: triggering ref)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate WXT types
        run: pnpm wxt:prepare

      - name: Type check
        run: pnpm compile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests + coverage gate
        run: pnpm test:run

      - name: Build Firefox extension
        run: pnpm build

      - name: web-ext lint
        run: pnpm dlx web-ext lint --source-dir .output/firefox-mv3

      - name: Check AMO listing metadata in sync
        run: pnpm check:listing

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate WXT types
        run: pnpm wxt:prepare

      - name: Type check e2e
        run: pnpm compile:e2e

      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      # The ubuntu-latest runner image ships geckodriver 0.37.0 (released
      # 2026-06-03) on $PATH. Under that version, scripting.executeScript({
      # files: [...] }) against a temporarily-installed addon fails with
      # "Unable to load script: moz-extension://<uuid>/extract-channel.js",
      # which leaves the popup permanently empty. 0.36.0 works against the
      # same Firefox build. Tracked upstream as mozilla/geckodriver#2248 +
      # https://bugzilla.mozilla.org/show_bug.cgi?id=2045054; fix uplifted to
      # Firefox 152 beta. Drop this pin once Firefox 152 ships.
      - name: Pin geckodriver to 0.36.0
        run: |
          curl -fsSL https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz \
            | sudo tar -xz -C /usr/local/bin/
          sudo chmod +x /usr/local/bin/geckodriver
          hash -r
          geckodriver --version | head -1

      # Builds the --mode e2e variant, then drives stock Firefox headlessly via
      # Selenium (Selenium Manager auto-resolves geckodriver). No xvfb needed –
      # headless Firefox runs without a display server.
      - name: E2E (Selenium + stock Firefox)
        run: pnpm e2e
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
