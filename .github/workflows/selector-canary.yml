name: Selector canary

# Nightly probe that re-fetches live YouTube and checks the ytInitialData parser
# + DOM selector chain still resolve a channel. Two outcome classes:
#   - Skip (green + warning annotation): transient fetch trouble – 429, 5xx
#     after retries, network errors, per-fetch timeouts. No issue filed.
#   - Fail (red + a single tracking issue): parser/selector regressions and
#     durable fetch problems (403 bot-block, 404 fixture rot) – needs a human.
# See test/selector-canary.ts.

on:
  schedule:
    # 06:00 UTC daily.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: selector-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    # Headroom for a total-outage night: 4 tests × ~170s worst case plus
    # install/prepare. A job killed by this timeout is cancelled, not failed,
    # so the issue step below wouldn't run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The root tsconfig.json extends ./.wxt/tsconfig.json, which only exists
      # after `wxt prepare`. Without it the oxc transform aborts before any test
      # runs (Tsconfig not found). The build and e2e jobs do the same.
      - name: Generate WXT types
        run: pnpm wxt:prepare

      - name: Run selector canary
        # `shell: bash` turns on pipefail so tee can't mask a vitest failure.
        shell: bash
        run: pnpm test:canary 2>&1 | tee canary.log

      - name: Warn when tests were skipped due to fetch trouble
        if: success()
        run: |
          # Match the vitest summary line, not any occurrence of "skipped" –
          # pnpm banners could false-positive on a bare grep.
          if grep -qE "Tests .* skipped" canary.log; then
            echo "::warning title=Selector canary::Fetch unavailable (429/5xx/network); skipped tests were NOT verified tonight. Persistent skips mean the canary is blind – consider a different fetch strategy."
          fi

      - name: File an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create selector-canary \
            --color FBCA04 \
            --description "Nightly selector canary failure" \
            --force
          existing=$(gh issue list --label selector-canary --state open --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            # Put the actual failure in the body so the issue doesn't claim a
            # layout change when the log says 403/404. The job can fail before
            # the run step (install, wxt prepare), so guard on the log existing;
            # `|| true` stops a no-match grep killing the step under `set -e`.
            errors=""
            if [ -f canary.log ]; then
              errors=$(grep -E "FAIL|Error:" canary.log | head -5 || true)
            fi
            if [ -z "$errors" ]; then
              errors="(no error lines captured – the job may have failed before the canary ran; check the run log)"
            fi
            {
              echo "Nightly selector canary failed. Run: ${RUN_URL}"
              echo
              echo '```'
              echo "$errors"
              echo '```'
              echo
              echo "If the errors point at the parser or DOM selector chain: re-capture fixtures (test/fixtures/README.md) and widen selectors (src/lib/selectors.ts) or JSON paths (src/lib/parse-channel-info.ts) as needed. A 403 means the runner is bot-blocked; a 404 means the pinned video/channel is gone."
            } > issue-body.md
            gh issue create \
              --title "Selector canary failing" \
              --label selector-canary \
              --body-file issue-body.md
          else
            echo "An open selector-canary issue already exists; not filing a duplicate."
          fi
