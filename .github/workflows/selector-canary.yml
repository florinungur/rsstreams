name: Selector canary

# Nightly live-YouTube check of the parser and selector chain; see
# test/selector-canary.ts.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: selector-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    # A timeout cancels the job rather than failing it, so the issue step
    # never runs; keep this above the canary's worst case.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate WXT types
        run: pnpm wxt:prepare

      - name: Run selector canary
        # Pipefail comes from `shell: bash`, so tee can't mask a vitest failure.
        shell: bash
        run: pnpm test:canary 2>&1 | tee canary.log

      - name: Warn when tests were skipped due to fetch trouble
        if: success()
        run: |
          if grep -qE "Tests .* skipped" canary.log; then
            echo "::warning title=Selector canary::Fetch unavailable (429/5xx/network); skipped tests were NOT verified tonight. Persistent skips mean the canary is blind – consider a different fetch strategy."
          fi

      - name: File an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create selector-canary \
            --color FBCA04 \
            --description "Nightly selector canary failure" \
            --force
          existing=$(gh issue list --label selector-canary --state open --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            errors=""
            if [ -f canary.log ]; then
              errors=$(grep -E "FAIL|Error:" canary.log | head -5 || true)
            fi
            if [ -z "$errors" ]; then
              errors="(no error lines captured – the job may have failed before the canary ran; check the run log)"
            fi
            {
              echo "Nightly selector canary failed. Run: ${RUN_URL}"
              echo
              echo '```'
              echo "$errors"
              echo '```'
              echo
              echo "If the errors point at the parser or DOM selector chain: re-capture fixtures (test/fixtures/README.md) and widen selectors (src/lib/selectors.ts) or JSON paths (src/lib/parse-channel-info.ts) as needed. A 403 means the runner is bot-blocked; a 404 means the pinned video/channel is gone."
            } > issue-body.md
            gh issue create \
              --title "Selector canary failing" \
              --label selector-canary \
              --body-file issue-body.md
          else
            echo "An open selector-canary issue already exists; not filing a duplicate."
          fi
