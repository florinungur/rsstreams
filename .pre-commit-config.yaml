# Markdown stays with oxfmt, which runs in CI and, reading .editorconfig, formats
# tables and lists as prettier does; prettier-markdown would fight it over fenced
# JS, which each wraps at its own default width.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --staged --verbose --redact
        language: system
        pass_filenames: false
